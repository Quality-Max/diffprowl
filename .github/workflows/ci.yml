name: CI

# The checks every change previously ran by hand (README "Development").
# The release workflow calls this one, so a tag can never ship code that
# would fail here.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in step with the toolchain recorded by the release workflow.
  RUST_TOOLCHAIN: 1.94.1

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install adapter tooling
        run: python -m pip install --disable-pip-version-check -r adapter/requirements-dev.txt
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        # Also builds target/debug/panthera, which the adapter end-to-end tests run.
        run: cargo test --locked
      - name: ruff
        run: |
          python -m ruff check adapter examples
          python -m ruff format --check adapter examples
      - name: adapter tests
        run: python -m unittest discover -s adapter -p 'test_*.py' -v
